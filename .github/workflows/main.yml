# GitHub Actions Windows RDP
# Secrets: RDP_PASSWORD, TAILSCALE_AUTHKEY
# Lưu thành .github/workflows/rdp.yml trên default branch
#
# GitHub-hosted Windows (public repo): 4 vCPU / 16 GB RAM / 14 GB SSD.
# - windows-2022    : Windows Server 2022 x64 (khuyên dùng, app tương thích tốt nhất)
# - windows-11-arm  : Windows 11 Enterprise ARM64 (đúng Win11, nhưng app x86 chạy giả lập)
# Không có Windows 11 x64 miễn phí trên GitHub-hosted runner.
# Repo private chỉ được 2 vCPU / 8 GB RAM.
name: Windows RDP Safe

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Thời gian giữ máy (phút)"
        required: true
        default: "120"
        type: choice
        options:
          - "60"
          - "120"
          - "240"
          - "330"
      runner:
        description: "windows-2022 = Server 2022 x64; windows-11-arm = Win11 ARM64"
        required: true
        default: "windows-2022"
        type: choice
        options:
          - "windows-2022"
          - "windows-11-arm"

permissions:
  contents: read

concurrency:
  group: windows-rdp-safe
  cancel-in-progress: true

jobs:
  rdp:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      RDP_USER: runneradmin
      TS_HOST: gh-rdp-${{ github.run_id }}

    steps:
      - name: 1. Kiểm tra
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "Runner label: ${{ inputs.runner }}"
          try {
            $os = Get-CimInstance Win32_OperatingSystem
            $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
            $cs = Get-CimInstance Win32_ComputerSystem
            $ram = [math]::Round($cs.TotalPhysicalMemory / 1GB, 1)
            Write-Host "OS: $($os.Caption) | Version: $($os.Version) | Arch: $($os.OSArchitecture)"
            Write-Host "CPU: $($cpu.Name) | $($cpu.NumberOfCores) cores / $($cpu.NumberOfLogicalProcessors) threads"
            Write-Host "RAM: $ram GB"
            if ($ram -lt 15) {
              Write-Warning "RAM dưới 16GB. Repo private chỉ được 2 vCPU/8GB; dùng repo public để có 4 vCPU/16GB."
            }
          } catch {
            Write-Warning "Không đọc được cấu hình máy: $($_.Exception.Message)"
          }

      - name: 2. Bật RDP
        shell: pwsh
        timeout-minutes: 10
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Thiếu secret RDP_PASSWORD."
          }
          if ($env:RDP_PASSWORD.Length -lt 14) {
            throw "RDP_PASSWORD phải từ 14 ký tự."
          }
          $classes = @(
            ($env:RDP_PASSWORD -cmatch '[A-Z]'),
            ($env:RDP_PASSWORD -cmatch '[a-z]'),
            ($env:RDP_PASSWORD -match '\d'),
            ($env:RDP_PASSWORD -match '[^A-Za-z0-9]')
          ) | Where-Object { $_ }
          if ($classes.Count -lt 3) {
            throw "RDP_PASSWORD cần ít nhất 3 trong 4 loại: chữ hoa, chữ thường, số, ký tự đặc biệt."
          }

          $user = $env:RDP_USER
          if (-not (Get-LocalUser -Name $user -ErrorAction SilentlyContinue)) {
            throw "Không thấy user $user."
          }

          $sec = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          Set-LocalUser -Name $user -Password $sec -PasswordNeverExpires $true
          Enable-LocalUser -Name $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue

          try {
            $acct = [ADSI]"WinNT://$env:COMPUTERNAME/$user,user"
            $acct.PasswordExpired = 0
            $acct.SetInfo()
          } catch {
            Write-Warning "Không clear được PasswordExpired: $($_.Exception.Message)"
          }

          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0 -Type DWord
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" -Value 1 -Type DWord
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "MaxIdleTime" -Value 0 -Type DWord
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "MaxDisconnectionTime" -Value 0 -Type DWord

          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule -ErrorAction SilentlyContinue

          Remove-NetFirewallRule -DisplayName "RDP Tailscale TCP" -ErrorAction SilentlyContinue
          Remove-NetFirewallRule -DisplayName "RDP Tailscale UDP" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "RDP Tailscale TCP" -Direction Inbound `
            -Protocol TCP -LocalPort 3389 -Action Allow -Profile Any `
            -RemoteAddress "100.64.0.0/10" | Out-Null
          New-NetFirewallRule -DisplayName "RDP Tailscale UDP" -Direction Inbound `
            -Protocol UDP -LocalPort 3389 -Action Allow -Profile Any `
            -RemoteAddress "100.64.0.0/10" | Out-Null

          Set-Service TermService -StartupType Manual
          try {
            Restart-Service TermService -Force -ErrorAction Stop
          } catch {
            Write-Warning "Restart TermService lỗi: $($_.Exception.Message)"
            Stop-Service UmRdpService -Force -ErrorAction SilentlyContinue
            Stop-Service TermService -Force -ErrorAction SilentlyContinue
            Start-Service TermService -ErrorAction SilentlyContinue
            Start-Service UmRdpService -ErrorAction SilentlyContinue
          }

          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            if (Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue) {
              $ok = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $ok) { throw "RDP không mở cổng 3389." }
          Write-Host "RDP đã bật cho $user."

      - name: 3. Tailscale
        shell: pwsh
        timeout-minutes: 15
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Thiếu secret TAILSCALE_AUTHKEY."
          }
          $ProgressPreference = "SilentlyContinue"

          function Get-File([string]$Url, [string]$Out) {
            $curl = Get-Command curl.exe -ErrorAction SilentlyContinue
            if ($curl) {
              & $curl.Source -L --fail --retry 3 --retry-delay 5 `
                --connect-timeout 20 --max-time 300 -sS -o $Out $Url
              if ($LASTEXITCODE -eq 0 -and (Test-Path $Out)) { return }
              Write-Warning "curl lỗi ($LASTEXITCODE), thử Invoke-WebRequest..."
            }
            Invoke-WebRequest -Uri $Url -OutFile $Out -MaximumRedirection 10 `
              -Headers @{ "User-Agent" = "Mozilla/5.0" }
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
            if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") {
              $msi = "$env:TEMP\tailscale-setup-arm64.msi"
              $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-arm64.msi"
            } else {
              $msi = "$env:TEMP\tailscale-setup-amd64.msi"
              $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
            }
            $ok = $false
            for ($i = 0; $i -lt 3; $i++) {
              try {
                Get-File $url $msi
                if ((Get-Item $msi).Length -gt 10MB) { $ok = $true; break }
              } catch {
                Write-Warning "Tải Tailscale lỗi: $($_.Exception.Message)"
              }
              Start-Sleep -Seconds 5
            }
            if (-not $ok) { throw "Tải Tailscale thất bại." }

            $p = Start-Process -FilePath "msiexec.exe" `
              -ArgumentList "/i `"$msi`" /qn /norestart TS_NOLAUNCH=true TS_UNATTENDEDMODE=true" `
              -PassThru -Wait
            if ($p.ExitCode -notin @(0, 3010, 1641)) {
              throw "Cài Tailscale lỗi (exit $($p.ExitCode))."
            }
          } else {
            Write-Host "Tailscale đã cài sẵn."
          }
          if (-not (Test-Path $ts)) { throw "Không thấy tailscale.exe." }

          $svc = $null
          for ($i = 0; $i -lt 30; $i++) {
            $svc = Get-Service | Where-Object { $_.Name -match 'Tailscale' } | Select-Object -First 1
            if ($svc) { break }
            Start-Sleep -Seconds 2
          }
          if (-not $svc) { throw "Không thấy service Tailscale." }
          Set-Service -Name $svc.Name -StartupType Automatic -ErrorAction SilentlyContinue
          if ($svc.Status -ne "Running") {
            Start-Service -Name $svc.Name -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 5
          }
          $svc = Get-Service -Name $svc.Name -ErrorAction SilentlyContinue
          if (-not $svc -or $svc.Status -ne "Running") {
            throw "Service Tailscale không chạy."
          }

          Start-Sleep -Seconds 5
          $up = $false
          for ($i = 0; $i -lt 3; $i++) {
            $upOut = & $ts up --auth-key $env:TS_AUTHKEY --hostname $env:TS_HOST `
              --accept-dns=false --unattended 2>&1
            $upOut | ForEach-Object { Write-Host $_ }
            if ($LASTEXITCODE -eq 0) { $up = $true; break }
            Write-Warning "tailscale up lỗi (lần $($i + 1)), thử lại..."
            Start-Sleep -Seconds 5
          }
          if (-not $up) {
            & $ts status 2>&1 | ForEach-Object { Write-Host $_ }
            throw "tailscale up thất bại."
          }

          $ip = $null
          for ($i = 0; $i -lt 60; $i++) {
            $ip = (& $ts ip -4 2>$null | ForEach-Object {
              $m = [regex]::Match($_, '100\.\d{1,3}\.\d{1,3}\.\d{1,3}')
              if ($m.Success) { $m.Value }
            } | Select-Object -First 1)
            if ($ip) { break }
            Start-Sleep -Seconds 2
          }
          if (-not $ip) { throw "Tailscale chưa có IP." }
          Write-Host "Tailscale IP: $ip"
          Add-Content -Path $env:GITHUB_ENV -Value "TS_IP=$ip"

      - name: 4. Discord
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $ProgressPreference = "SilentlyContinue"

          $discord = "$env:LOCALAPPDATA\Discord\Update.exe"
          if (Test-Path $discord) {
            Write-Host "Discord đã cài sẵn: $discord"
            Add-Content -Path $env:GITHUB_ENV -Value "DISCORD_STATUS=OK"
            return
          }

          function Get-File([string]$Url, [string]$Out) {
            $curl = Get-Command curl.exe -ErrorAction SilentlyContinue
            if ($curl) {
              & $curl.Source -L --fail --retry 3 --retry-delay 5 `
                --connect-timeout 20 --max-time 300 -sS -o $Out $Url
              if ($LASTEXITCODE -eq 0 -and (Test-Path $Out)) { return }
              Write-Warning "curl lỗi ($LASTEXITCODE), thử Invoke-WebRequest..."
            }
            Invoke-WebRequest -Uri $Url -OutFile $Out -MaximumRedirection 10 `
              -Headers @{ "User-Agent" = "Mozilla/5.0" }
          }

          $out = "$env:TEMP\DiscordSetup.exe"
          $url = "https://discord.com/api/download?platform=win"
          $ok = $false
          for ($i = 0; $i -lt 3; $i++) {
            try {
              Get-File $url $out
              if ((Get-Item $out).Length -gt 20MB) { $ok = $true; break }
            } catch {
              Write-Warning "Tải Discord lỗi: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 5
          }
          if (-not $ok) { throw "Tải Discord thất bại." }

          Get-Process -Name "Discord" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $out -ArgumentList "-s" -PassThru
          if (-not $p.WaitForExit(300000)) { throw "Discord installer quá thời gian." }
          if ($p.ExitCode -notin @(0, 3010, 1641)) {
            Write-Warning "Discord installer exit code $($p.ExitCode)."
          }

          for ($i = 0; $i -lt 30; $i++) {
            if (Test-Path $discord) { break }
            Start-Sleep -Seconds 2
          }
          if (-not (Test-Path $discord)) {
            $found = Get-ChildItem "$env:LOCALAPPDATA\Discord" -Filter Update.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) { $discord = $found.FullName }
          }
          if (-not (Test-Path $discord)) { throw "Discord cài thất bại." }
          Add-Content -Path $env:GITHUB_ENV -Value "DISCORD_STATUS=OK"
          Write-Host "Discord OK: $discord"

      - name: 5. Tối ưu
        shell: pwsh
        continue-on-error: true
        run: |
          tzutil /s "SE Asia Standard Time"
          powercfg /hibernate off
          powercfg /setactive SCHEME_MIN

          $vfx = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"
          New-Item -Path $vfx -Force | Out-Null
          Set-ItemProperty -Path $vfx -Name "VisualFXSetting" -Value 2 -Type DWord -ErrorAction SilentlyContinue
          Set-ItemProperty "HKCU:\Control Panel\Desktop" -Name "DragFullWindows" -Value "0" -ErrorAction SilentlyContinue
          Set-ItemProperty "HKCU:\Control Panel\Desktop\WindowMetrics" -Name "MinAnimate" -Value "0" -ErrorAction SilentlyContinue
          Set-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
            -Name "EnableTransparency" -Value 0 -Type DWord -ErrorAction SilentlyContinue

          foreach ($s in @("SysMain", "WSearch", "DiagTrack")) {
            Stop-Service $s -Force -ErrorAction SilentlyContinue
            Set-Service $s -StartupType Disabled -ErrorAction SilentlyContinue
          }
          netsh int tcp set global autotuninglevel=normal | Out-Null

      - name: 6. Thông tin
        shell: pwsh
        run: |
          $ip = $env:TS_IP
          if (-not $ip) {
            $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
            $ip = (& $ts ip -4 2>$null | ForEach-Object {
              $m = [regex]::Match($_, '100\.\d{1,3}\.\d{1,3}\.\d{1,3}')
              if ($m.Success) { $m.Value }
            } | Select-Object -First 1)
          }
          if (-not $ip) { throw "Không lấy được Tailscale IP." }

          $discordStatus = $env:DISCORD_STATUS
          if (-not $discordStatus) { $discordStatus = "xem log step 4" }

          $text = @(
            "## RDP sẵn sàng",
            "- Runner: ${{ inputs.runner }}",
            "- Host: $ip",
            "- Port: 3389",
            "- User: $env:RDP_USER",
            "- Password: secret RDP_PASSWORD",
            "- Discord: $discordStatus",
            "- Thời gian: ${{ inputs.minutes }} phút"
          ) -join "`n"
          Add-Content $env:GITHUB_STEP_SUMMARY $text
          Write-Host $text

      - name: 7. Giữ máy
        shell: pwsh
        timeout-minutes: ${{ fromJSON(inputs.minutes) }}
        run: |
          $end = (Get-Date).AddMinutes([int]"${{ inputs.minutes }}")
          Write-Host "RDP sống đến $($end.ToString('HH:mm:ss'))."
          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 60
          }

      - name: 8. Debug khi lỗi
        if: failure()
        shell: pwsh
        run: |
          Write-Host "User: $([Security.Principal.WindowsIdentity]::GetCurrent().Name)"
          Get-Service TermService, Tailscale -ErrorAction SilentlyContinue | Format-Table Name, Status, StartType
          Get-NetTCPConnection -LocalPort 3389 -ErrorAction SilentlyContinue | Format-Table LocalAddress, LocalPort, State
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (Test-Path $ts) {
            & $ts version 2>&1 | ForEach-Object { Write-Host $_ }
            & $ts status 2>&1 | ForEach-Object { Write-Host $_ }
            & $ts ip -4 2>&1 | ForEach-Object { Write-Host $_ }
          }
          Get-ChildItem "$env:ProgramData\Tailscale" -Filter *.log -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 3 |
            ForEach-Object {
              Write-Host "----- $($_.FullName) -----"
              Get-Content $_.FullName -Tail 60 -ErrorAction SilentlyContinue
            }
            
